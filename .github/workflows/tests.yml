name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.11, and the source uses
        # `list[float] | np.ndarray`, which needs 3.10+. Test the floor and
        # the version actually developed against.
        python-version: ["3.11", "3.12"]

    env:
      # monte_carlo imports pyplot at module scope; a headless runner has no
      # display, so pin the non-interactive backend rather than relying on
      # matplotlib guessing right.
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install the package
        # Catches a broken pyproject or a missing package, which importing
        # from the source tree would hide.
        run: pip install -e .

      - name: Run tests
        run: pytest tests/ -q
