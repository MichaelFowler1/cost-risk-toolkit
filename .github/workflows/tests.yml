name: tests

on:
  # Every branch, not just main. The matrix is the only place the floor is
  # actually exercised, so restricting it to main meant a version-specific
  # problem could not surface until after merge -- which is exactly how a
  # Python 3.12 f-string construct reached this repo.
  push:
  pull_request:
  workflow_dispatch:
  # Weekly, with nothing changed here. Every lane installs the newest
  # releases its bounds allow, so this is where someone else's release
  # breaking the library shows up: PuLP 4.0.0 removed the solver the
  # portfolio module called, on a day nothing was pushed, and a fresh
  # install of the release on PyPI broke with it. Monday 06:17 UTC, off the
  # hour to stay clear of the scheduler's busiest minute. GitHub pauses
  # scheduled runs after 60 days without a push, and says so by email.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every version pyproject claims to support, floor to ceiling. The
        # source does use `list[float] | np.ndarray` and friends, but every one
        # of those sits in an annotation in a file carrying `from __future__
        # import annotations`, so none of them is evaluated at runtime and 3.9
        # runs the suite unmodified. The 3.9 lane is what proves that, and it
        # is the reason requires-python could drop from 3.11 to 3.9.
        #
        # The runner is named per lane rather than left at ubuntu-latest,
        # because 3.9 is the one version that cannot follow it. setup-python
        # resolves interpreters from the manifest in actions/python-versions,
        # and that manifest has linux builds of 3.9 for 16.04 through 24.04 and
        # nothing newer, while 3.10 and up all have 26.04 builds. ubuntu-latest
        # is 24.04 today, so every lane works; the day it moves to 26.04 the
        # setup step on the 3.9 lane would fail to find an interpreter, and
        # since 3.9 is past end of life a 26.04 build of it is never going to
        # be published. Pinning that lane to ubuntu-24.04 keeps the floor
        # tested for as long as GitHub hosts the image. The lanes that can
        # follow the current runner still do.
        include:
          - python-version: "3.9"
            runner: ubuntu-24.04
          - python-version: "3.10"
            runner: ubuntu-latest
          - python-version: "3.11"
            runner: ubuntu-latest
          - python-version: "3.12"
            runner: ubuntu-latest
          - python-version: "3.13"
            runner: ubuntu-latest
          - python-version: "3.14"
            runner: ubuntu-latest

    env:
      # cost_core.reporting.charts imports pyplot at module scope; a headless
      # runner has no display, so pin the non-interactive backend rather than
      # relying on matplotlib guessing right.
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and its test tooling
        # Resolved from the version range pyproject declares, not from
        # requirements.txt. The pins in requirements.txt are the versions this
        # repo develops against, and four of the five will not install on 3.9,
        # three of them not on 3.10: numpy 2.4.4, pandas 3.0.3 and scipy 1.17.1
        # all declare Requires-Python >=3.11, and matplotlib 3.10.9 declares
        # >=3.10. So a pinned install cannot be what the lower lanes run.
        # Installing the package itself is also the more honest test: it is what
        # a user gets, and it checks that the declared range really does resolve
        # on every version we claim to support. `[plots]` because matplotlib is
        # an optional extra as of 1.0.0, and the chart tests and the CLI smoke
        # test need it.
        #
        # What makes a resolved install safe to run the goldens against is the
        # upper bound on numpy and scipy in pyproject.toml. numpy 2.5.3 and
        # scipy 1.18.1 both declare Requires-Python >=3.12, so the 3.12, 3.13
        # and 3.14 lanes are all new enough to be offered them, and this step
        # runs before the pinning step below on every lane including 3.14.
        # Without the bound those three would resolve both, and on the two whose
        # tests then run unpinned -- 3.12 and 3.13 -- five tests failed, on
        # numbers rather than on behaviour. That was measured on 3.12; 3.13
        # resolves the same two. Inside the bound a lane can still pick up a new
        # patch release, so a resolved lane is not a frozen lane; the pinned lane
        # below is the one that holds the stack completely still.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[plots,optimize]'
          pip install pytest

      - name: Check a real install exposes every subpackage
        # An editable install resolves against the source tree, so it cannot
        # catch a packages.find pattern that misses cost_core.synth and the
        # other subpackages -- everything would import anyway. A non-editable
        # install, imported from outside the repo, can.
        #
        # --no-cache-dir because pip caches the wheels it builds from a local
        # directory and setup-python's `cache: pip` carries that cache between
        # runs. The version string does not move on every commit, so a cached
        # wheel from an earlier run can be reinstalled in place of the one this
        # commit would build, which is exactly the check this step exists to
        # make. Building it fresh costs a couple of seconds.
        run: |
          pip install --force-reinstall --no-deps --no-cache-dir .
          cd /tmp
          python -c "import cost_core.synth, cost_core.ingest, cost_core.cer, cost_core.reporting, cost_core.lotmodel, cost_core.program, cost_core.lots, cost_core.cli, cost_core.public, cost_core.aoa, cost_core.portfolio, cost_core.schedule, cost_core.evm; print('subpackages import from site-packages')"
          cd "$GITHUB_WORKSPACE"
          pip install -e '.[plots]'

      - name: Check the engine imports without the plots extra
        # matplotlib is optional as of 1.0.0, and the claim that the engine
        # does not need it is only worth something if something checks. Take it
        # away, import the whole non-drawing surface, confirm a plotting entry
        # point names the extra rather than raising a bare "No module named",
        # then put it back for the tests.
        run: |
          pip uninstall -y matplotlib
          cd /tmp
          python -c "import cost_core, cost_core.lotmodel, cost_core.program, cost_core.lots, cost_core.monte_carlo, cost_core.reporting, cost_core.fitting, cost_core.cer, cost_core.ingest, cost_core.synth; print('engine imports without matplotlib')"
          python -c "import cost_core.reporting.charts" > import_error.txt 2>&1 || true
          grep -q "cost-core\[plots\]" import_error.txt
          rm import_error.txt
          cd "$GITHUB_WORKSPACE"
          pip install -e '.[plots]'

      - name: Pin to the development set
        # One lane also runs the exact versions in requirements.txt, so the
        # numbers the goldens pin are checked against the stack they were
        # recorded on and not only against whatever the floors resolve to.
        # Last, so nothing after it can quietly resolve a different matplotlib.
        if: matrix.python-version == '3.14'
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -q

      - name: Smoke-test the end-to-end CLI
        # The full path writes real PNGs and a log; a broken chart or a
        # mismatch between two modules would not show up in a unit test.
        run: |
          ce-core full-run --out /tmp/ce_run --seed 1 --iters 3000 --programs 8
          test -s /tmp/ce_run/ASSUMPTIONS.md
          test -s /tmp/ce_run/charts/s_curve.png
          test -s /tmp/ce_run/charts/tornado.png

  sbom:
    # A software bill of materials: every package a full install pulls in,
    # with its version and licence, in CycloneDX, the form software approval
    # reviews take. Built from a clean environment with every extra, so it
    # lists what a user who installs everything gets, and checked so a new
    # dependency under a copyleft or undeclared licence stops the build here
    # rather than surfacing in someone's review. It runs on the weekly
    # schedule too, which is when a dependency's own new release would bring
    # one in. 3.12 because that is what the release is built with, and the
    # first Python PuLP 4 installs on.
    name: SBOM and licences
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the package with every extra, in an environment of its own
        # Its own environment so the SBOM tool and pip's own packages are not
        # listed as dependencies of the library.
        run: |
          python -m venv /tmp/target
          /tmp/target/bin/python -m pip install --upgrade pip
          /tmp/target/bin/pip install '.[plots,public,optimize]'
          python -m pip install 'cyclonedx-bom>=7,<8'

      - name: Write the SBOM
        run: >
          cyclonedx-py environment --pyproject pyproject.toml --mc-type library
          --of JSON -o sbom.cdx.json /tmp/target/bin/python

      - name: Check every dependency is permissively licensed
        run: python tools/sbom_licences.py sbom.cdx.json --markdown licences.md

      - name: Show the licence table on the run
        if: always()
        run: test -f licences.md && cat licences.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom
          path: |
            sbom.cdx.json
            licences.md
          retention-days: 30

  package:
    # The publish workflow builds the distributions in one job and uploads
    # them from another, passing them across with upload-artifact and
    # download-artifact. That path otherwise runs only when a release is cut,
    # so a broken action version would first show up mid-release. This runs
    # the same build, the same pair of actions and a clean install of the
    # wheel on every push.
    name: package round trip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel, and check the metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist-check
          path: dist/
          retention-days: 1

  package-install:
    name: install the built wheel
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: dist-check
          path: dist/

      - name: Install the wheel alone and import every subpackage
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python -c "import cost_core, cost_core.public, cost_core.aoa, cost_core.portfolio, cost_core.lotmodel, cost_core.program; print('cost_core', cost_core.__version__, 'installed from the built wheel')"
          ce-core --help > /dev/null
