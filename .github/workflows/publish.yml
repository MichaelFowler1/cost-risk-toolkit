name: Publish to PyPI

# Publishes on every GitHub Release using PyPI Trusted Publishing (OIDC).
# There is no API token anywhere: not in the repo, not in Actions secrets, not
# on any machine. PyPI is configured to trust this workflow in this repository,
# and GitHub mints a short-lived identity token for the job.
#
# One-time setup on PyPI, before the first run:
#   https://pypi.org/manage/account/publishing/
#   PyPI Project Name: cost-core
#   Owner:             MichaelFowler1
#   Repository name:   cost-risk-toolkit
#   Workflow name:     publish.yml
#   Environment name:  pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm style versioning needs full history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refuse anything but a release tag that matches the package version
        # A manual run on main once published main's code under the 1.0.1
        # label, so PyPI's 1.0.1 and the v1.0.1 tag are not the same code.
        # Only a tag vX.Y.Z whose X.Y.Z is the version in pyproject.toml may
        # publish, whether the run came from a release or was started by hand.
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          case "$GITHUB_REF" in
            refs/tags/v*) tag="${GITHUB_REF#refs/tags/v}" ;;
            *) echo "::error::Refusing to publish from $GITHUB_REF: only a release tag vX.Y.Z may publish."; exit 1 ;;
          esac
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match the version in pyproject.toml ($version)."
            exit 1
          fi
          echo "Publishing $version from tag v$tag"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata renders on PyPI
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing; this is the whole mechanism
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
