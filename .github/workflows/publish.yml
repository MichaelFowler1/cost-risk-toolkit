name: Publish to PyPI

# Publishes on every GitHub Release using PyPI Trusted Publishing (OIDC).
# There is no API token anywhere: not in the repo, not in Actions secrets, not
# on any machine. PyPI is configured to trust this workflow in this repository,
# and GitHub mints a short-lived identity token for the job.
#
# One-time setup on PyPI, before the first run:
#   https://pypi.org/manage/account/publishing/
#   PyPI Project Name: cost-core
#   Owner:             MichaelFowler1
#   Repository name:   cost-risk-toolkit
#   Workflow name:     publish.yml
#   Environment name:  pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm style versioning needs full history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refuse anything but a release tag that matches the package version
        # A manual run on main once published main's code under the 1.0.1
        # label, so PyPI's 1.0.1 and the v1.0.1 tag are not the same code.
        # Only a tag vX.Y.Z whose X.Y.Z is the version in pyproject.toml may
        # publish, whether the run came from a release or was started by hand.
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          case "$GITHUB_REF" in
            refs/tags/v*) tag="${GITHUB_REF#refs/tags/v}" ;;
            *) echo "::error::Refusing to publish from $GITHUB_REF: only a release tag vX.Y.Z may publish."; exit 1 ;;
          esac
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match the version in pyproject.toml ($version)."
            exit 1
          fi
          echo "Publishing $version from tag v$tag"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata renders on PyPI
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing; this is the whole mechanism
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  sbom:
    # The SBOM and licence table for exactly this release, attached to the
    # GitHub release beside the source, so a reviewer approving a version has
    # the list of what that version installs without building anything. Only
    # for a real release: a manual run has no release to attach to. The check
    # also runs on every push in tests.yml; here it has to pass again against
    # whatever the dependencies' newest releases are on the day.
    name: Attach the SBOM to the release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to upload release assets; nothing else
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install the built wheel with every extra, in an environment of its own
        run: |
          python -m venv /tmp/target
          /tmp/target/bin/python -m pip install --upgrade pip
          wheel=$(ls dist/*.whl)
          /tmp/target/bin/pip install "${wheel}[plots,public,optimize]"
          python -m pip install 'cyclonedx-bom>=7,<8'

      - name: Write the SBOM and check the licences
        run: |
          version="${GITHUB_REF_NAME#v}"
          cyclonedx-py environment --pyproject pyproject.toml --mc-type library \
            --of JSON -o "cost-core-${version}.cdx.json" /tmp/target/bin/python
          python tools/sbom_licences.py "cost-core-${version}.cdx.json" \
            --markdown "cost-core-${version}-licences.md"

      - name: Attach them to the release
        # Even when the check fails: a reviewer should see the table with the
        # package marked for review, not a release with no table at all.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "cost-core-${version}.cdx.json" "cost-core-${version}-licences.md"
