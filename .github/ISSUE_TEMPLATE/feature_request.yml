name: I wish it could...
description: Something you do at work that cost-core doesn't do yet.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the task, not only the feature: what you do today, in what tool, and what's painful about it. **Public page:** no real program data or CUI.
  - type: textarea
    id: task
    attributes:
      label: The task
      placeholder: Every month I pull the IPMDAR delivery into Excel and...
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
  - type: textarea
    id: wish
    attributes:
      label: What would help
