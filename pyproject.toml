[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cost_core"
version = "0.1.0"
description = "Cost-Estimation Core Library and CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0"
]

[project.scripts]
ce-core = "cli.ce_core_cli:main"

[tool.setuptools.packages.find]
# "cost_core" alone does not match "cost_core.synth" and friends -- these
# patterns are matched against the full dotted name, so the subpackages need
# the wildcard or an installed copy would be missing everything below the top
# level.
include = ["cost_core", "cost_core.*", "cli"]