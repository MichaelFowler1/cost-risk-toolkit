[build-system]
# 77.0.3 is the oldest setuptools checked to read the licence metadata below,
# an SPDX string plus license-files (PEP 639). 76.1 rejects this file outright
# with a schema error, so any lower floor here is a promise the build cannot
# keep. pip builds in isolation by default and fetches a new enough one anyway.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name on PyPI. The import name stays `cost_core`; setuptools
# normalises "cost-core" and "cost_core" to the same artefact names, so the
# hyphen is only what people type after `pip install`.
name = "cost-core"
version = "2.5.0"
description = "Cost risk, EVM forecasts, DCMA schedule checks, JCL, AoA and portfolio choice for defense and space programs, in one Python package: Excel in, report and briefing out."
readme = "README.md"
# 3.9 is the floor because nothing here needs more. Every PEP 604 union in the
# source sits in an annotation in a file with `from __future__ import
# annotations`, so none of them is evaluated at runtime, and the whole suite
# passes on 3.9 unmodified. The CI matrix runs the floor on every push so the
# claim stays true.
requires-python = ">=3.9"
dependencies = [
    # The two upper bounds are reproducibility bounds, not compatibility ones:
    # the library imports and runs fine above them, but it stops reproducing the
    # numbers this release pins. numpy 2.5 and scipy 1.18 each land the unbiased
    # MUPE and ZMPE refits in a slightly different place, which moves golden
    # leaves by up to 8e-9 and 4.5e-8 relative against a 1e-9 tolerance, and
    # scipy 1.18 also changes the draws the risk model produces, so the
    # frozen-draw hashes in tests/test_monte_carlo.py fail too. Both are seen on
    # Windows, where the goldens were captured; elsewhere those leaves carry a
    # measured allowance and the hashes are skipped, so a bound is measured on
    # Windows. Neither is a bug in either library. The figures and the
    # measurement are in CHANGELOG.md under 1.0.0; lifting a bound means
    # rebaselining the goldens and the frozen draws under the new stack and
    # recording what moved, not widening a tolerance until the failure stops.
    "numpy>=1.26.0,<2.5",
    "pandas>=2.1.0",
    "scipy>=1.11.0,<1.18",
    # The desktop lot cost model writes an Excel workbook as its deliverable,
    # and the lot reader accepts .xlsx, so this is core rather than optional.
    "openpyxl>=3.1.0",
    # ce-core.toml is read with the standard library's tomllib from 3.11; before
    # that, with tomli, the same parser before it joined the standard library
    # (MIT).
    "tomli>=1.1.0; python_version < '3.11'"
]

# Mirrors CITATION.cff, which is the record for the same release. No email:
# the repository is the contact point and a published address cannot be recalled.
authors = [{ name = "Michael Fowler" }]
# PolyForm Noncommercial for everything after 1.0.1; 1.0.0 and 1.0.1 were
# released under Apache-2.0 and stay so. NOTICE carries the Required Notice
# line the licence obliges anyone redistributing to pass on, which is why it
# ships in the wheel beside LICENSE, as does the additional permission for
# Government Work. That permission only widens the licence, so the SPDX
# identifier stays the base licence's.
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE", "LICENSE-GOVERNMENT-WORK.md"]
keywords = ["cost-estimating", "monte-carlo", "learning-curve", "risk-analysis", "csdr",
            "selected-acquisition-report", "analysis-of-alternatives", "portfolio-optimization",
            "schedule-risk", "joint-confidence-level", "earned-value-management",
            "earned-schedule", "dcma-14-point"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/MichaelFowler1/cost-risk-toolkit"
Changelog = "https://github.com/MichaelFowler1/cost-risk-toolkit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# matplotlib draws the charts and nothing else. The engine, the lot models, the
# CERs, the risk simulation and the Excel workbooks all run without it, so a
# caller who only wants numbers should not have to install a plotting stack to
# get them. Anything that draws -- `ce-core full-run`, `ce-core fit-lots
# --simulate --out` (the buy S-curve is the only chart that command writes, and
# it needs `--simulate`), `cost_core.reporting.charts`,
# `monte_carlo.plot_distribution` -- needs this extra, and says so by name when
# it is missing. python-pptx (MIT; lxml, XlsxWriter and Pillow under it, all
# permissive) writes the PowerPoint briefing, which is made of those charts,
# so it comes with the same extra rather than one more name to remember.
plots = ["matplotlib>=3.8.0", "python-pptx>=0.6.21"]
# pdfplumber reads the text of public PDFs (SARs) by position, which is what
# cost_core.public parses. Only reading a PDF needs it: the parser itself runs
# on text, and the tests run without it.
public = ["pdfplumber>=0.11"]
# PuLP writes the portfolio integer program; HiGHS solves it, through highspy.
# Both are MIT-licensed. HiGHS replaced CBC, which PuLP 2.x and 3.x bundle
# and PuLP 4 left to a `cbc` extra, because CBC is under the Eclipse Public
# License, a weak copyleft that software approval reviews flag; an
# installation that already has CBC and no highspy still solves with it.
# The floors are the oldest pair tested: PuLP 2.8.0 with highspy 1.7.1, on
# Python 3.9. The suite also passes on PuLP 3.3 and 4.0 with highspy 1.15.
optimize = ["pulp>=2.8", "highspy>=1.7"]

[project.scripts]
ce-core = "cost_core.cli:main"

[tool.setuptools.package-data]
# The worked examples `ce-core demo` runs and `ce-core template` copies. They
# have to be in the wheel, not only the repository, or someone who installed
# from PyPI has nothing to run before they have data of their own.
"cost_core.examples" = ["*.json", "*.csv", "*.xml", "*.xlsx"]

[tool.setuptools.packages.find]
# "cost_core" alone does not match "cost_core.synth" and friends -- these
# patterns are matched against the full dotted name, so the subpackages need
# the wildcard or an installed copy would be missing everything below the top
# level.
include = ["cost_core", "cost_core.*"]
